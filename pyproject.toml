[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "black-litterman-portfolio"
version = "0.1.0"
description = "A Black-Litterman asset allocation and portfolio optimization toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["black_litterman*"]
